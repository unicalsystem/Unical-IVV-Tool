name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test
        # The headless (offscreen) Qt plugin can crash at process exit on Windows
        # after all tests have finished, so the result is judged from the JUnit file.
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: |
          python -m pytest -q --junitxml=test-results.xml || ver > nul
          python -c "import xml.etree.ElementTree as E,sys; r=E.parse('test-results.xml').getroot(); s=r if r.tag=='testsuite' else r[0]; t,f,e=int(s.get('tests')),int(s.get('failures')),int(s.get('errors')); print(f'tests={t} failures={f} errors={e}'); sys.exit(0 if t>0 and f==0 and e==0 else 1)"
      - name: Build application (PyInstaller)
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --windowed --name UnicalIVVTool --icon assets\unical.ico --add-data "assets;assets" --add-data "config;config" --add-data "templates;templates" --add-data "database\schema.sql;database" --add-data "checklists;checklists" --add-data "standards;standards" --collect-submodules pymupdf --exclude-module pandas --exclude-module numpy --exclude-module matplotlib --exclude-module tkinter --exclude-module IPython --exclude-module pytest main.py
          pyinstaller --noconfirm --clean --windowed --onefile --name UnicalIVVTool_Portable --icon assets\unical.ico --add-data "assets;assets" --add-data "config;config" --add-data "templates;templates" --add-data "database\schema.sql;database" --add-data "checklists;checklists" --add-data "standards;standards" --collect-submodules pymupdf --exclude-module pandas --exclude-module numpy --exclude-module matplotlib --exclude-module tkinter --exclude-module IPython --exclude-module pytest main.py
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Get-Content config\app_config.json | ConvertFrom-Json).version.Split(' ')[0]
          & $iscc "/DAppVersion=$ver" installer\UnicalIVVTool.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem Output, dist\UnicalIVVTool_Portable.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: UnicalIVVTool-installer
          path: |
            Output/*.exe
            dist/UnicalIVVTool_Portable.exe
      - name: Publish to exe-build branch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item Output\*.exe publish\
          Copy-Item dist\UnicalIVVTool_Portable.exe publish\
          # git hosting limit is 100 MB per file: store larger exes as 90 MB parts (join with: copy /b a.part* a.exe)
          New-Item -ItemType Directory -Force parts | Out-Null
          foreach ($f in Get-ChildItem publish\*.exe) {
            if ($f.Length -gt 95MB) {
              $in = [IO.File]::OpenRead($f.FullName); $buf = New-Object byte[] (90MB); $n = 0
              while (($r = $in.Read($buf, 0, $buf.Length)) -gt 0) {
                $out = [IO.File]::Create("$PWD\parts\$($f.Name).part$n"); $out.Write($buf, 0, $r); $out.Close(); $n++
              }
              $in.Close()
            } else { Copy-Item $f.FullName parts\ }
          }
          git config user.name "Unical Build"
          git config user.email "noreply@unical.in"
          git checkout --orphan exe-build
          git rm -rf --cached . | Out-Null
          git add -f parts
          git commit -m "Windows installer ${{ github.sha }}"
          git push -f origin exe-build
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content config\app_config.json | ConvertFrom-Json).version.Split(' ')[0]
          $tag = "v$ver-build.${{ github.run_number }}"
          gh release create $tag publish\*.exe --repo ${{ github.repository }} --target ${{ github.sha }} --title "Unical IV&V Review Tool $ver (build ${{ github.run_number }})" --notes "Windows installer (UnicalIVVTool_Setup_$ver.exe) and portable one-file exe. Built from ${{ github.sha }} after all tests passed."
