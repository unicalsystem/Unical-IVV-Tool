name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [unical-ivv-tool-build]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test
        # The headless (offscreen) Qt plugin can crash at process exit on Windows
        # after all tests have finished, so the result is judged from the JUnit file.
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: |
          python -m pytest -q --junitxml=test-results.xml || ver > nul
          python -c "import xml.etree.ElementTree as E,sys; r=E.parse('test-results.xml').getroot(); s=r if r.tag=='testsuite' else r[0]; t,f,e=int(s.get('tests')),int(s.get('failures')),int(s.get('errors')); print(f'tests={t} failures={f} errors={e}'); sys.exit(0 if t>0 and f==0 and e==0 else 1)"
      - name: Build
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --windowed --name UnicalIVVTool --add-data "assets;assets" --add-data "config;config" --add-data "database\schema.sql;database" main.py
          xcopy /E /I /Y config dist\UnicalIVVTool\config
          xcopy /E /I /Y templates dist\UnicalIVVTool\templates
          for %%d in (database logs reports uploaded_documents checklists) do if not exist dist\UnicalIVVTool\%%d mkdir dist\UnicalIVVTool\%%d
      - uses: actions/upload-artifact@v4
        with:
          name: UnicalIVVTool-windows
          path: dist/UnicalIVVTool
